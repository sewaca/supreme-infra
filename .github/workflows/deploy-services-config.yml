name: Deploy Services Config

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Kubernetes namespace where services are deployed"
        required: false
        default: "default"

env:
  HELM_VERSION: "v3.16.3"

jobs:
  deploy:
    name: Deploy services-config ConfigMap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Yandex Cloud
        uses: ./.github/workflows/jobs/setup-yandex-cloud
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          yc-cloud-id: ${{ secrets.YC_CLOUD_ID }}
          yc-folder-id: ${{ secrets.YC_FOLDER_ID }}
          yc-k8s-cluster-id: ${{ secrets.YC_K8S_CLUSTER_ID }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Deploy services-config ConfigMap
        run: |
          echo "Deploying services-config to namespace: ${{ github.event.inputs.namespace }}"

          helm upgrade services-config ./infra/helmcharts/services-config \
            --namespace ${{ github.event.inputs.namespace }} \
            --install \
            --wait

          echo "ConfigMap deployed successfully"

      - name: Verify ConfigMap
        run: |
          echo "Verifying ConfigMap..."
          kubectl get configmap services-config \
            -n ${{ github.event.inputs.namespace }} \
            -o yaml
