<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ subject }}</title>
  </head>
  <body style="margin:0;padding:0;background:#f0f2f9;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="background:#f0f2f9;padding:40px 16px;">
      <tr>
        <td align="center">

          <!-- Card -->
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
                 style="max-width:600px;width:100%;background:#ffffff;border-radius:16px;overflow:hidden;
                        box-shadow:0 4px 24px rgba(20,30,80,.08);">

            <!-- Header -->
            <tr>
              <td style="background:linear-gradient(135deg,#3b5cff 0%,#7b6cff 100%);
                         padding:28px 36px;">
                <span style="color:#ffffff;font-size:22px;font-weight:700;letter-spacing:-0.5px;">Supreme</span>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding:36px 36px 28px;color:#1a2240;">

                <p style="margin:0 0 12px;font-size:16px;font-weight:500;">
                  Здравствуйте, {{ name }}!
                </p>

                <p style="margin:0 0 28px;font-size:14px;line-height:1.6;color:#4b5779;">
                  {{ headline }}
                </p>

                <!-- Code box -->
                <table role="presentation" cellpadding="0" cellspacing="0" border="0"
                       style="margin:0 auto 28px;">
                  <tr>
                    <td style="background:#f0f2f9;border-radius:12px;padding:20px 44px;
                                border:1.5px solid #dde2f5;">
                      <span style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;
                                   font-size:36px;font-weight:700;letter-spacing:10px;
                                   color:#3b5cff;display:block;">{{ code }}</span>
                    </td>
                  </tr>
                </table>

                <p style="margin:0 0 8px;font-size:13px;color:#6b7591;">
                  Код действует <strong>{{ ttl_minutes }}&nbsp;минут</strong>
                  (до&nbsp;<strong>{{ expires_at_human }}</strong>).
                </p>

                <p style="margin:20px 0 0;font-size:12px;line-height:1.5;color:#9ba3be;">
                  Если вы не запрашивали этот код — просто проигнорируйте письмо.
                  Ваш аккаунт в безопасности.
                </p>

              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="padding:16px 36px;background:#f8f9fd;border-top:1px solid #eaecf5;
                         font-size:11px;color:#9ba3be;line-height:1.5;">
                &copy; Supreme &mdash; это автоматическое письмо, пожалуйста, не отвечайте на него.
              </td>
            </tr>

          </table>
          <!-- /Card -->

        </td>
      </tr>
    </table>
  </body>
</html>
