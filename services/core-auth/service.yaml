image:
  repository: core-auth

nameOverride: "core-auth"
fullnameOverride: "core-auth"

replicas: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 8002

metrics:
  enabled: true
  port: 9464

secrets:
  SMTP_PASSWORD: SMTP_PASSWORD

env:
  PORT: "8002"
  PYTHON_ENV: "production"
  DB_HOST: "pgbouncer-core-auth"
  DB_PORT: "5432"
  DB_NAME: "core_auth_db"
  DB_USER: "core_auth_user"
  # DB_PASSWORD is passed from GitHub Secrets during deployment
  REDIS_AUTH_CACHE_URL: "redis://redis-auth-cache.default.svc.cluster.local:6379"
  SMTP_HOST: "smtp.yandex.ru"
  SMTP_PORT: "465"
  SMTP_USERNAME: "sevabulgackov@yandex.ru"
  SMTP_USE_TLS: "true"
  SMTP_USE_STARTTLS: "false"
  MAIL_FROM: "sevabulgackov@yandex.ru"
  MAIL_FROM_NAME: "ЛК СПбГУТ"
  APP_BASE_URL: "https://supreme.local"

livenessProbe:
  httpGet:
    path: /core-auth/status

readinessProbe:
  httpGet:
    path: /core-auth/status

resources:
  limits:
    cpu: 300m
    memory: 512Mi
  requests:
    cpu: 150m
    memory: 300Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

overrides:
  production:
    canary:
      enabled: true
