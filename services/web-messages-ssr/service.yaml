# Конфигурация для web-messages-ssr сервиса
# Используется при деплое через: helm install web-messages-ssr ./infra/helmcharts/frontend-service -f services/web-messages-ssr/service.yaml

image:
  repository: web-messages-ssr

nameOverride: "web-messages-ssr"
fullnameOverride: "web-messages-ssr"

service:
  type: ClusterIP
  port: 80
  targetPort: 3007

metrics:
  enabled: true
  port: 9464

configMapRef: "services-config"

env:
  PORT: "3007"
  NODE_ENV: "production"

resources:
  limits:
    cpu: 600m
    memory: 512Mi
  requests:
    cpu: 180m
    memory: 300Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

overrides:
  production:
    canary:
      enabled: true
