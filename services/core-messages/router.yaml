# Generated router configuration for core-messages service
# auth_level and public are manually maintained — use pnpm run generate:router to update routes.

service: core-messages
type: fastapi
routes:
  - path: /core-messages/broadcasts
    method: GET
    auth_level: valid
    public: false
  - path: /core-messages/broadcasts
    method: POST
    auth_level: valid
    public: false
  - path: /core-messages/broadcasts/groups
    method: GET
    auth_level: valid
    public: false
  - path: /core-messages/conversations
    method: GET
    auth_level: valid
    public: false
  - path: /core-messages/conversations/[^/]+
    method: DELETE
    auth_level: valid
    public: false
  - path: /core-messages/conversations/[^/]+
    method: GET
    auth_level: valid
    public: false
  - path: /core-messages/conversations/[^/]+/messages
    method: GET
    auth_level: valid
    public: false
  - path: /core-messages/conversations/[^/]+/messages
    method: POST
    auth_level: valid
    public: true
  - path: /core-messages/conversations/[^/]+/messages/[^/]+
    method: DELETE
    auth_level: valid
    public: true
  - path: /core-messages/conversations/[^/]+/messages/[^/]+
    method: PATCH
    auth_level: valid
    public: true
  - path: /core-messages/conversations/[^/]+/messages/read
    method: POST
    auth_level: valid
    public: true
  - path: /core-messages/conversations/direct
    method: POST
    auth_level: valid
    public: false
  - path: /core-messages/conversations/unread-count
    method: GET
    auth_level: valid
    public: true
  - path: /core-messages/conversations/updates
    method: GET
    auth_level: valid
    public: true
  - path: /core-messages/files
    method: POST
    auth_level: valid
    public: true
  - path: /core-messages/messages/search
    method: GET
    auth_level: valid
    public: false
  - path: /core-messages/users/[^/]+
    method: GET
    auth_level: valid
    public: false
  - path: /core-messages/users/search
    method: GET
    auth_level: valid
    public: true
  - path: /core-messages/ws
    method: GET
    auth_level: none
    public: true
