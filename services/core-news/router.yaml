# Generated router configuration for core-news service
# auth_level and public are manually maintained — use pnpm run generate:router to update routes.

service: core-news
type: fastapi
routes:
  - path: /core-news/news
    method: GET
    auth_level: none
    public: false
  - path: /core-news/news/sync
    method: POST
    auth_level: none
    public: false
