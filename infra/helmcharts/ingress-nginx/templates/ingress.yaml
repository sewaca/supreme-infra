{{- if .Values.ingress.enabled }}
{{- range $rule := .Values.ingress.rules }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Values.ingress.name }}-{{ $rule.service }}
  namespace: {{ $.Values.ingress.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
{{- with (coalesce $rule.rateLimit $.Values.ingress.rateLimit) }}
    nginx.ingress.kubernetes.io/limit-rps: {{ .rps | quote }}
    {{- if .connections }}
    nginx.ingress.kubernetes.io/limit-connections: {{ .connections | quote }}
    {{- end }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: {{ .burstMultiplier | quote }}
{{- if .whitelist }}
    nginx.ingress.kubernetes.io/limit-whitelist: {{ .whitelist | quote }}
{{- end }}
{{- end }}
{{- range $k, $v := ($rule.extraAnnotations | default dict) }}
    {{ $k }}: {{ $v | quote }}
{{- end }}
spec:
  ingressClassName: nginx
  {{- if $.Values.ingress.tls.enabled }}
  tls:
  - hosts:
    {{- range $.Values.ingress.tls.hosts }}
    - {{ . }}
    {{- end }}
    secretName: {{ $.Values.ingress.tls.secretName }}
  {{- end }}
  rules:
  {{- range $.Values.ingress.tls.hosts }}
  - host: {{ . }}
    http:
      paths:
      {{- range $rule.paths }}
      - path: {{ .path }}
        pathType: {{ .pathType | default "ImplementationSpecific" }}
        backend:
          service:
            name: {{ $rule.service }}
            port:
              number: {{ $rule.port }}
      {{- end }}
  {{- end }}
{{- end }}
{{- end }}