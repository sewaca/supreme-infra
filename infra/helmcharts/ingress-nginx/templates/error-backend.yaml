---
apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-error-page
  namespace: ingress-nginx
data:
  default.conf: |
    server {
        listen 8080;

        error_page 502 =502 /error.html;
        error_page 503 =503 /error.html;
        error_page 504 =504 /error.html;

        location /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            if ($http_x_code = "502") { return 502; }
            if ($http_x_code = "503") { return 503; }
            if ($http_x_code = "504") { return 504; }
            return 503;
        }

        location = /error.html {
            root /usr/share/nginx/html;
            default_type text/html;
            internal;
            add_before_body "/__ec?c=$http_x_code";
            addition_types text/html;
        }

        location = /__ec {
            internal;
            return 200 "<script>window.__ec='$arg_c';</script>";
        }
    }
  error.html: |
{{ .Files.Get "files/error.html" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: custom-error-backend
  namespace: ingress-nginx
  labels:
    app: custom-error-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: custom-error-backend
  template:
    metadata:
      labels:
        app: custom-error-backend
      annotations:
        checksum/config: {{ .Files.Get "files/error.html" | sha256sum }}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: html
          configMap:
            name: custom-error-page
            items:
              - key: error.html
                path: error.html
        - name: conf
          configMap:
            name: custom-error-page
            items:
              - key: default.conf
                path: default.conf
---
apiVersion: v1
kind: Service
metadata:
  name: custom-error-backend
  namespace: ingress-nginx
spec:
  selector:
    app: custom-error-backend
  ports:
    - port: 8080
      targetPort: 8080
